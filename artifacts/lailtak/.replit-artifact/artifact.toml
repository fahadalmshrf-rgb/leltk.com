import { useState, useEffect } from "react";

export function HeroSection() {
  const [showSubtitle, setShowSubtitle] = useState(false);

  useEffect(() => {
    // Show subtitle after exactly 1.89 seconds (1890 ms)
    const timer = setTimeout(() => {
      setShowSubtitle(true);
    }, 1890);

    return () => clearTimeout(timer);
  }, []);

  return (
    <div className="flex flex-col items-center justify-center text-center py-12">
      {/* Title */}
      <h1 className="text-5xl font-extrabold text-primary tracking-tight">
        ليلتك
      </h1>

      {/* Subtitle with Smooth Fade-In after 1.89s */}
      <p
        className={`mt-3 text-xl text-muted-foreground transition-all duration-700 transform ${
          showSubtitle
            ? "opacity-100 translate-y-0"
            : "opacity-0 -translate-y-2 pointer-events-none"
        }`}
      >
        منصة متخصصة تجهيز حفلات الأفراح
      </p>
    </div>
  );
}