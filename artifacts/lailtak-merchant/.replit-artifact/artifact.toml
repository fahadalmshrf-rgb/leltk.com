kind = "web"
previewPath = "/merchant/"
title = "ليلتك — بوابة أصحاب القاعات"
version = "1.0.0"
id = "artifacts/lailtak-merchant"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/merchant/" ]
localPort = 8080

[services.development]
run = "sleep infinity"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lailtak-merchant", "run", "build" ]
publicDir = "artifacts/lailtak-merchant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8080"
BASE_PATH = "/merchant/"
