kind = "mobile"
previewPath = "/mobile/"
title = "ليلتك — تطبيق الجوال"
version = "1.0.0"
id = "artifacts/lailtak-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 26065

[services.development]
run = "pnpm --filter @workspace/lailtak-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lailtak-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lailtak-mobile", "run", "serve" ]

[services.env]
PORT = "26065"
BASE_PATH = "/mobile/"
